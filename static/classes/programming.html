<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohawk Programming</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oswald:400,600,700|Open+Sans:400,600,700&display=swap">
<style>
  /* Colours and fonts come from the class calendar site (Google Sites). */
  :root {
    --red: #f34f4c;
    --red-dark: #d3413f;
    --ink: #1f1f1f;
    --page: #f4f4f4;
    --card: #ffffff;
    --line: rgba(31, 31, 31, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 16px/1.6 "Open Sans", sans-serif;
  }

  header {
    position: relative;
    overflow: hidden;
    background: #1f1f1f;
    color: #fff;
    padding: 48px 16px 0;
  }
  /* the mascot from the calendar banner, faded into the dark on its left */
  header::before {
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 55%;
    max-width: 620px;
    background: url("/static/classes/mascot.jpg") right center / cover no-repeat;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 50%);
            mask-image: linear-gradient(90deg, transparent, #000 50%);
  }
  header .wrap { position: relative; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header h1 {
    font-family: Oswald, sans-serif;
    font-weight: 700;
    font-size: 48px;
    line-height: 1.1;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0;
  }
  header h1::after {          /* the red bar under MOHAWK on the calendar */
    content: "";
    display: block;
    width: 140px;
    height: 5px;
    background: var(--red);
    margin-top: 14px;
  }
  header p { margin: 12px 0 0; font-size: 18px; opacity: 0.9; }

  /* TABS. One radio button per class, at the top of the page; clicking a
     tab's label checks its radio, and the CSS below shows that class's
     topics. No script needed - the little one at the bottom only lets a
     link like /#programming-1 open on that tab. A new class needs a radio,
     a label, a section, and its id added to the two rules marked ADD. */
  .tab-radio { position: absolute; opacity: 0; pointer-events: none; }
  .tabs { display: flex; gap: 6px; margin-top: 28px; flex-wrap: wrap; }
  .tabs label {
    font-family: Oswald, sans-serif;
    font-size: 18px;
    letter-spacing: 0.5px;
    padding: 8px 20px;
    border-radius: 6px 6px 0 0;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    cursor: pointer;
  }
  .tabs label:hover { background: rgba(255, 255, 255, 0.22); }
  .class-topics { display: none; }
  /* ADD: the selected tab looks like part of the page below it */
  #tab-intro:checked ~ header label[for="tab-intro"],
  #tab-programming-1:checked ~ header label[for="tab-programming-1"] {
    background: var(--page);
    color: var(--ink);
  }
  /* ADD: and its topics are the ones shown */
  #tab-intro:checked ~ main #intro-topics,
  #tab-programming-1:checked ~ main #programming-1-topics { display: block; }
  .tab-radio:focus-visible ~ header .tabs { outline: 2px solid var(--red); outline-offset: 4px; }

  main.wrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    gap: 24px;
    align-items: start;
    padding: 28px 16px 48px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 4px solid var(--red);
    border-radius: 6px;
    padding: 20px 24px;
  }
  .card h2 {
    font-family: Oswald, sans-serif;
    font-weight: 600;
    font-size: 28px;
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  aside .card h2 { font-size: 20px; }

  a { color: var(--ink); text-decoration-color: var(--red); text-underline-offset: 3px; }
  a:hover { color: var(--red-dark); }

  /* topics */
  .topics { list-style: none; margin: 0; padding: 0; }
  .topics > li { margin: 0 0 18px; }
  .topics > li > b {
    font-family: Oswald, sans-serif;
    font-weight: 600;
    font-size: 19px;
  }
  .topics ul { list-style: none; margin: 6px 0 0; padding-left: 18px; }
  .topics ul li { margin: 4px 0; }
  .topics ul li::before { content: "🔗"; margin-right: 8px; }
  .topics ul li.notes::before { content: "📄"; }
  .topics ul li.assignment::before { content: "📝"; }
  .topics ul li.quiz::before { content: "✅"; }
  .topics ul li.video::before { content: "🎬"; }

  .resources { list-style: none; margin: 0; padding: 0; }
  .resources li { margin: 6px 0; }

  footer { text-align: center; color: #777; font-size: 14px; padding: 0 16px 32px; }

  /* a lesson: its name, then a Live and an Assignment button */
  .topics ul li.lesson::before { content: "📘"; }
  .topics a.live, .topics a.assign {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 12px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
  .topics a.live { background: var(--red); color: #fff; }
  .topics a.live::before { content: "● "; }
  .topics a.live:hover { background: var(--red-dark); color: #fff; }
  .topics a.assign { border: 1.5px solid var(--ink); color: var(--ink); }
  .topics a.assign:hover { background: var(--ink); color: #fff; }

  @media (max-width: 760px) {
    main.wrap { grid-template-columns: 1fr; }
    header h1 { font-size: 36px; }
    header::before { width: 100%; max-width: none; opacity: 0.35; }
  }
</style>
</head>
<body>

<!-- one radio per tab; "checked" is the tab shown when the page opens -->
<input class="tab-radio" type="radio" name="tab" id="tab-intro" checked>
<input class="tab-radio" type="radio" name="tab" id="tab-programming-1">

<header>
  <div class="wrap">
    <h1>Mohawk Programming</h1>
    <p>Mr. Franz</p>
    <nav class="tabs">
      <label for="tab-intro">Intro to Programming</label>
      <label for="tab-programming-1">Programming 1</label>
    </nav>
  </div>
</header>

<main class="wrap">

  <div>

    <!--
      HOW TO ADD THINGS
      ─────────────────
      Each class is its own <section> below. Find the right one, then:

      A link inside a topic is one line. The class picks the icon:

        <li class="notes"><a href="LINK">Notes: ...</a></li>             📄
        <li class="assignment"><a href="LINK">Assignment 1: ...</a></li> 📝
        <li class="quiz"><a href="LINK">Quiz: ...</a></li>               ✅
        <li class="video"><a href="LINK">Video: ...</a></li>             🎬
        <li><a href="LINK">Anything else</a></li>                         🔗

      A lesson is its name, then a button for each link it has. Leave out the
      Live line for a lesson you won't teach live:

        <li class="lesson">Lists                                          📘
          <a class="live" href="/live/CODE">Live</a>
          <a class="assign" href="/a/CODE">Assignment</a>
        </li>

      A new topic is a whole block — copy one from below, newest at the bottom:

        <li>
          <b>Topic 2: Name</b>
          <ul>
            <li class="notes"><a href="LINK">Notes: ...</a></li>
          </ul>
        </li>

      A link that leaves this site (Classroom, Docs, YouTube) opens in a new
      tab if you add  target="_blank"  inside the <a ...>.
    -->

    <!-- ════════════════════ INTRO TO PROGRAMMING ════════════════════ -->
    <section class="card class-topics" id="intro-topics">
      <h2>Intro to Programming</h2>
      <ul class="topics">

        <li>
          <b>Topic 1: Getting Started</b>
          <ul>
            <li><a href="/new">Open PyIDE (the code editor)</a></li>
          </ul>
        </li>

      </ul>
    </section>

    <!-- ════════════════════ PROGRAMMING 1 ════════════════════ -->
    <section class="card class-topics" id="programming-1-topics">
      <h2>Programming 1</h2>
      <ul class="topics">

        <li>
          <b>Topic 1: Getting Started</b>
          <ul>
            <li><a href="/new">Open PyIDE (the code editor)</a></li>
          </ul>
        </li>

      </ul>
    </section>

  </div>

  <aside>
    <section class="card">
      <h2>Resources</h2>
      <ul class="resources">
        <li><a href="/new">PyIDE editor</a></li>
        <li><a href="/my">My saved work</a></li>
        <li><a href="https://sites.google.com/mohawk.k12.pa.us/franz-class-calendar/home" target="_blank">Class calendar</a></li>
      </ul>
    </section>
  </aside>

</main>

<footer>Mohawk Area School District</footer>

<script>
  // Only so a link can open on a tab (/#programming-1), and the address
  // follows the tab you pick. The page works the same without it.
  (function () {
    function show() {
      var r = document.getElementById("tab-" + location.hash.slice(1));
      if (r) r.checked = true;
    }
    show();
    window.addEventListener("hashchange", show);
    document.querySelectorAll(".tab-radio").forEach(function (r) {
      r.addEventListener("change", function () {
        history.replaceState(null, "", "#" + r.id.slice(4));
      });
    });
  })();
</script>

</body>
</html>
