databases:
  - name: pyide-db
    databaseName: pyide
    user: pyide
    plan: free

services:
  - type: web
    name: pyide
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: pyide-db
          property: connectionString
